name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cancelling a deploy mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Same checks a PR must pass (checks.yml); nothing is deployed unless they pass.
  checks:
    # Reusable workflows cannot elevate the caller's token permissions.
    # Only the CodeQL job in checks.yml actually requests security-events: write.
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: [checks]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://oriens.luisgosampaio.com
    env:
      IMAGE_TAG: ${{ github.sha }}
      REMOTE_DIR: projects/oriens
      WEB_ROOT: /var/www/oriens
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json

      - name: Build frontend
        working-directory: apps/client
        env:
          VITE_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: |
          npm ci
          npm run build

      - name: Build API image
        run: docker build -t "oriens-api:${IMAGE_TAG}" apps/api

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!name}" ] || { echo "::error::Secret $name não configurado"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Upload API image and compose file
        run: |
          ssh vps "mkdir -p ~/${REMOTE_DIR} ${WEB_ROOT} /opt/oriens-uploads"
          docker save "oriens-api:${IMAGE_TAG}" | gzip | ssh vps 'gunzip | docker load'
          scp ops/compose/docker-compose-prod.yml "vps:${REMOTE_DIR}/docker-compose-prod.yml"

      - name: Write production .env on VPS
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          API_PORT: ${{ vars.API_PORT || '8080' }}
          ORIENS_MCP_ENABLED: ${{ vars.ORIENS_MCP_ENABLED || 'false' }}
          # The API serves MCP/OAuth at the public site root (nginx routes /mcp, /oauth2 and /.well-known there).
          ORIENS_MCP_ISSUER: https://oriens.luisgosampaio.com
          ORIENS_MCP_FRONTEND: https://oriens.luisgosampaio.com
          ORIENS_MCP_ENCRYPTION_PASSWORD: ${{ secrets.ORIENS_MCP_ENCRYPTION_PASSWORD }}
          ORIENS_MCP_ENCRYPTION_SALT: ${{ secrets.ORIENS_MCP_ENCRYPTION_SALT }}
        run: |
          names="DB_URL DB_USER DB_PASSWORD JWT_SECRET API_PORT ORIENS_MCP_ENABLED"
          if [ "$ORIENS_MCP_ENABLED" = "true" ]; then
            names="$names ORIENS_MCP_ISSUER ORIENS_MCP_FRONTEND ORIENS_MCP_ENCRYPTION_PASSWORD ORIENS_MCP_ENCRYPTION_SALT"
          fi
          # Validate everything before touching the remote file, so a bad secret never leaves a partial .env.
          for name in $names; do
            value="${!name}"
            [ -n "$value" ] || { echo "::error::Secret $name não configurado"; exit 1; }
            case "$value" in
              *"'"*|*$'\n'*) echo "::error::$name não pode conter aspas simples nem quebra de linha"; exit 1 ;;
            esac
          done
          [ "$(printf '%s' "$JWT_SECRET" | wc -c)" -ge 64 ] || { echo "::error::JWT_SECRET precisa de pelo menos 64 bytes"; exit 1; }
          for name in $names; do
            printf "%s='%s'\n" "$name" "${!name}"
          done | ssh vps "umask 077 && cat > ~/${REMOTE_DIR}/.env"

      - name: Restart API (rollback on failed health check)
        run: |
          ssh vps "IMAGE_TAG=${IMAGE_TAG} REMOTE_DIR=${REMOTE_DIR} bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/"${REMOTE_DIR}"
          set -a; . ./.env; set +a
          compose() { docker compose -f docker-compose-prod.yml "$@"; }

          if docker image inspect oriens-api:latest >/dev/null 2>&1; then
            docker tag oriens-api:latest oriens-api:previous
          fi
          docker tag "oriens-api:${IMAGE_TAG}" oriens-api:latest
          # Shared with the VPS observability stack (FutspringV2 ops/observability); whoever deploys first creates it.
          docker network create observability >/dev/null 2>&1 || true
          compose up -d --force-recreate --remove-orphans

          echo "Aguardando a API responder em 127.0.0.1:${API_PORT}..."
          # The shared VPS takes ~3.5 min to boot the API under load; allow 6 min before rolling back.
          for _ in $(seq 1 72); do
            # Any HTTP status means Spring finished booting.
            if curl -s -o /dev/null --max-time 5 "http://127.0.0.1:${API_PORT}/"; then
              compose ps
              docker images oriens-api --format '{{.Tag}}' | grep -vxE 'latest|previous' | tail -n +4 \
                | xargs -r -I {} docker rmi "oriens-api:{}" >/dev/null 2>&1 || true
              docker image prune -f >/dev/null
              echo "API ${IMAGE_TAG} no ar."
              exit 0
            fi
            sleep 5
          done

          echo "::error::API não respondeu em 360s; restaurando a versão anterior."
          compose logs --tail 100 api || true
          if docker image inspect oriens-api:previous >/dev/null 2>&1; then
            docker tag oriens-api:previous oriens-api:latest
            compose up -d --force-recreate
          fi
          exit 1
          REMOTE

      # Only after the API is healthy, so the new UI never talks to an old/broken API.
      - name: Publish frontend
        run: tar -C apps/client/dist -czf - . | ssh vps "tar -xzf - -C ${WEB_ROOT}"
