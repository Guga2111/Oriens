# OAuth and signed attachment URLs can carry secrets in the query string.
log_format oriens_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent "-" "$http_user_agent"';

server {
    server_name oriens.luisgosampaio.com;
    access_log /var/log/nginx/access.log oriens_noquery;

    location / {
        # The OAuth flow ID can also arrive in the SPA query string.
        error_log /dev/null;
        root /var/www/oriens;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        location ~ ^/api/task/[0-9]+/attachments$ {
            client_max_body_size 20m;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://127.0.0.1:8080;
        }

        location /api/task/attachments/content/ {
            # Nginx error messages can include the original request line.
            error_log /dev/null;
            proxy_pass http://127.0.0.1:8080/task/attachments/content/;
        }

        location /api/integrations/mcp/ {
            error_log /dev/null;
            proxy_pass http://127.0.0.1:8080/integrations/mcp/;
        }
    }

    location /oauth2/ {
        error_log /dev/null;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The SPA reaches the cookie's API path through /api.
        proxy_cookie_path /integrations/mcp/ /api/integrations/mcp/;
    }

    location /.well-known/oauth- {
        error_log /dev/null;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location = /mcp {
        error_log /dev/null;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        # Streamable HTTP may answer with SSE.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /mcp/ {
        error_log /dev/null;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/oriens.luisgosampaio.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/oriens.luisgosampaio.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name oriens.luisgosampaio.com;
    access_log /var/log/nginx/access.log oriens_noquery;
    error_log /dev/null;

    if ($host = oriens.luisgosampaio.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    return 404; # managed by Certbot
}
