services:
  api:
    image: oriens-api:${ORIENS_API_TAG:-latest}
    container_name: oriens-api
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no ambiente}
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ORIENS_MCP_ENABLED: ${ORIENS_MCP_ENABLED:-false}
      ORIENS_MCP_OPENBOTENABLED: ${ORIENS_MCP_OPENBOT_ENABLED:-false}
      ORIENS_MCP_ISSUER: ${ORIENS_MCP_ISSUER:-}
      ORIENS_MCP_FRONTEND: ${ORIENS_MCP_FRONTEND:-}
      # Spring removes property-name hyphens when binding environment variables.
      ORIENS_MCP_ENCRYPTIONPASSWORD: ${ORIENS_MCP_ENCRYPTION_PASSWORD:-}
      ORIENS_MCP_ENCRYPTIONSALT: ${ORIENS_MCP_ENCRYPTION_SALT:-}
      ORIENS_MCP_CODEXREDIRECTS: ${ORIENS_MCP_CODEX_REDIRECTS:-http://127.0.0.1/callback}
      ORIENS_MCP_CLAUDEREDIRECTS: ${ORIENS_MCP_CLAUDE_REDIRECTS:-http://localhost:8765/callback}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: /opt/oriens-uploads
        target: /opt/oriens-uploads
        bind:
          create_host_path: false
    # The shared Prometheus of the VPS (FutspringV2 ops/observability) scrapes oriens-api:8081 over this
    # network; the management port is never published on the host.
    networks:
      - default
      - observability
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  observability:
    # Created and owned by the shared observability stack on the VPS.
    external: true
