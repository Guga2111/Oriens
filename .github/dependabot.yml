version: 2

# Version updates target dev. Security updates always target the default branch
# (main), and require Dependabot alerts/security updates enabled in GitHub.
updates:
  - package-ecosystem: maven
    directory: /oriens-api
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Recife
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /oriens-front
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Recife
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Recife
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
