# Keep SDK diagnostics from logging attacker-controlled JSON, callbacks or arguments.
logging.level.io.modelcontextprotocol=OFF
# Bound form parsing before OAuth filters deserialize token requests.
server.tomcat.max-http-form-post-size=256KB

# Flyway owns the schema (Hibernate only validates). {vendor} keeps PostgreSQL-only SQL away from
# the H2 test databases, which find no migrations there and keep using create-drop.
spring.flyway.locations=classpath:db/migration/{vendor}
