name: Checks

# Runs on every PR to dev/main and is reused by the deploy, so what gates a merge is exactly
# what gates production. No path filter: a required check must always report, even on docs-only PRs.
on:
  pull_request:
    branches: [dev, main]
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B scripts/check-docs-links.py
      - run: python3 -B -m unittest discover -s scripts/tests -p 'test_check_docs_links.py' -v

  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      # McpP*PostgresTest fail without their Postgres; test-postgres runs them.
      - run: ./mvnw -B test '-Dtest=!McpP2PostgresTest,!McpP3PostgresTest,!McpP4PostgresTest' -Dsurefire.failIfNoSpecifiedTests=false

  # H2 never runs the Flyway migrations; here every *PostgresTest boots a fresh PostgreSQL 15
  # database, so a broken migration or Postgres-only query fails the PR.
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - run: scripts/postgres-tests.sh

  test-front:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The build also type-checks imports; the deploy rebuilds with production variables.
      - run: npm run build

  security-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar Gitleaks com checksum verificado
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Provar detecção de segredos e redação dos valores
        env:
          GITLEAKS_BINARY: ${{ runner.temp }}/gitleaks
        run: python3 -B -m unittest discover -s .github/security -p 'test_gitleaks.py' -v
      - name: Reprovar segredos em todo o histórico da branch
        # HEAD includes old commits even when the secret was removed from today's files.
        # No raw secret report is uploaded; redaction is also required on stdout/stderr.
        run: >-
          "$RUNNER_TEMP/gitleaks" git . --log-opts=HEAD --redact=100
          --ignore-gitleaks-allow --no-banner --no-color --exit-code=1

  security-dependencies-front:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Auditar dependências de produção e desenvolvimento
        working-directory: apps/client
        # Audit the lockfile without installing packages or running lifecycle scripts.
        run: npm audit --include=dev --audit-level=high --json > "$RUNNER_TEMP/npm-audit.json"
      - name: Preservar relatório completo do npm
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit
          path: ${{ runner.temp }}/npm-audit.json
          if-no-files-found: error
          retention-days: 7

  security-dependencies-api:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Identificar a atualização diária da base NVD
        id: nvd-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: nvd-cache
        with:
          path: apps/api/target/dependency-check-data
          key: nvd-feed-13.0.0-${{ runner.os }}-${{ steps.nvd-date.outputs.date }}
          restore-keys: nvd-feed-13.0.0-${{ runner.os }}-
      - name: Reprovar vulnerabilidades Java com CVSS maior ou igual a 7
        working-directory: apps/api
        # Official NVD feeds require no API key, including on fork/bot PRs.
        run: ./mvnw -B -Psecurity-audit dependency-check:check
      - name: Guardar a base mesmo quando achados reprovam a análise
        if: >-
          ${{ !cancelled() && steps.nvd-cache.outputs.cache-hit != 'true' &&
          hashFiles('apps/api/target/dependency-check-report.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/api/target/dependency-check-data
          key: ${{ steps.nvd-cache.outputs.cache-primary-key }}
      - name: Preservar relatórios completos do Dependency-Check
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check
          path: |
            apps/api/target/dependency-check-report.json
            apps/api/target/dependency-check-report.html
          if-no-files-found: error
          retention-days: 7

  security-codeql:
    name: security-codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    env:
      # Full-branch findings must block too; do not restrict queries to changed lines.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provar a política de severidade e falha fechada
        run: python3 -B -m unittest discover -s .github/security -p 'test_codeql_gate.py' -v
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Compilar a API para análise estática
        if: matrix.language == 'java-kotlin'
        working-directory: apps/api
        run: ./mvnw -B -Dmaven.test.skip=true package
      - name: Analisar e publicar resultados CodeQL
        id: codeql-analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
          upload: always
      - name: Reprovar achados altos e críticos de toda a análise
        if: ${{ !cancelled() }}
        env:
          SARIF_DIRECTORY: ${{ runner.temp }}/codeql-results
          ANALYSIS_OUTCOME: ${{ steps.codeql-analysis.outcome }}
        run: |
          [ "$ANALYSIS_OUTCOME" = "success" ] || { echo "::error::A análise CodeQL não concluiu com sucesso"; exit 1; }
          python3 -B .github/security/codeql_gate.py "$SARIF_DIRECTORY"
      - name: Preservar relatórios CodeQL
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 7
