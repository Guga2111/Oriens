spring.application.name=oriens-api

# Configuracao do Servidor de email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=luisgosampaiowork@gmail.com
spring.mail.password=xdfa wstc tvlh teaw 

# Configuracoes adicionais
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Keep SDK diagnostics from logging attacker-controlled JSON, callbacks or arguments.
logging.level.io.modelcontextprotocol=OFF
# Bound form parsing before OAuth filters deserialize token requests.
server.tomcat.max-http-form-post-size=256KB

# Flyway owns the schema (Hibernate only validates). {vendor} keeps PostgreSQL-only SQL away from
# the H2 test databases, which find no migrations there and keep using create-drop.
spring.flyway.locations=classpath:db/migration/{vendor}

# Metrics for the internal Prometheus only: the management port is never published by the compose
# file nor proxied by nginx, so /actuator does not exist on the public port (8080).
management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=oriens-api
# Fixed latency buckets (~10 series per route) instead of the full histogram; enough for p50/p95/p99.
management.metrics.distribution.slo.http.server.requests=25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s
# The mail starter would register a health check that opens an SMTP connection on every probe.
management.health.mail.enabled=false
