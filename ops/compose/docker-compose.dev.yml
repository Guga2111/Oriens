name: oriens-api

services:
  oriens-api-dev:
    build: ../../apps/api
    container_name: oriens_api_dev
    ports:
      - "127.0.0.1:8080:8080"
    restart: always
    environment:
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no ambiente}
      SPRING_PROFILES_ACTIVE: dev
      ORIENS_MCP_ENABLED: ${ORIENS_MCP_ENABLED:-false}
      ORIENS_MCP_ISSUER: ${ORIENS_MCP_ISSUER:-http://127.0.0.1:8080}
      ORIENS_MCP_FRONTEND: ${ORIENS_MCP_FRONTEND:-http://127.0.0.1:5173}
      # Spring removes property-name hyphens when binding environment variables.
      ORIENS_MCP_ENCRYPTIONPASSWORD: ${ORIENS_MCP_ENCRYPTION_PASSWORD:-}
      ORIENS_MCP_ENCRYPTIONSALT: ${ORIENS_MCP_ENCRYPTION_SALT:-}
      ORIENS_MCP_CODEXREDIRECTS: ${ORIENS_MCP_CODEX_REDIRECTS:-http://127.0.0.1/callback}
      ORIENS_MCP_CLAUDEREDIRECTS: ${ORIENS_MCP_CLAUDE_REDIRECTS:-http://localhost:8765/callback}
    depends_on:
      - oriens-postgres-dev

  oriens-postgres-dev:
    image: postgres:15-alpine
    container_name: oriens_postgres_dev
    ports:
      - "5432:5432" # Expõe a porta para o DBeaver, etc.
    environment:
      POSTGRES_DB: oriensdb
      POSTGRES_USER: oriensuser
      POSTGRES_PASSWORD: orienspassword
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

volumes:
  postgres_data_dev:
