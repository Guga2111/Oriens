name: Regressão visual

on:
  pull_request:
    branches: [dev, main, 'refac/**']

permissions:
  contents: read

jobs:
  test-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --ipc=host
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - run: npm run test:visual
      - name: Publicar relatório e diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-visual
          path: |
            apps/client/playwright-report/
            apps/client/test-results/visual/
          retention-days: 7
