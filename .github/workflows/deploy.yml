name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cancelling a deploy mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Same checks a PR must pass (checks.yml); nothing is deployed unless they pass.
  checks:
    # Reusable workflows cannot elevate the caller's token permissions.
    # Only the CodeQL job in checks.yml actually requests security-events: write.
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/checks.yml

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [checks]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://oriens.luisgosampaio.com
    env:
      IMAGE_TAG: ${{ github.sha }}
      REMOTE_DIR: projects/oriens
      WEB_ROOT: /var/www/oriens
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json

      - name: Build frontend and API image
        env:
          VITE_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: ./scripts/deploy.sh build

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!name}" ] || { echo "::error::Secret $name não configurado"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Publish API and frontend
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          API_PORT: ${{ vars.API_PORT || '8080' }}
          ROLLBACK_COMPATIBLE_PAIR: ${{ vars.ROLLBACK_COMPATIBLE_PAIR }}
          ORIENS_MCP_ENABLED: ${{ vars.ORIENS_MCP_ENABLED || 'false' }}
          # The API serves MCP/OAuth at the public site root (nginx routes /mcp, /oauth2 and /.well-known there).
          ORIENS_MCP_ISSUER: https://oriens.luisgosampaio.com
          ORIENS_MCP_FRONTEND: https://oriens.luisgosampaio.com
          ORIENS_MCP_ENCRYPTION_PASSWORD: ${{ secrets.ORIENS_MCP_ENCRYPTION_PASSWORD }}
          ORIENS_MCP_ENCRYPTION_SALT: ${{ secrets.ORIENS_MCP_ENCRYPTION_SALT }}
        run: ./scripts/deploy.sh publish
